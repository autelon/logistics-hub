packages:
  - apps/*
  - packages/*

# 버전은 여기 한 곳에서만 관리한다. 각 package.json 에서는 "catalog:" 로 참조.
# strict: `pnpm add` 가 catalog 에 없는 버전을 package.json 에 직접 적는 것을 막는다.
catalogMode: strict
cleanupUnusedCatalogs: true

catalog:
  # toolchain
  typescript: 7.0.2
  turbo: ^2.11.7
  prettier: ^3.9.9
  '@ianvs/prettier-plugin-sort-imports': ^4.7.1
  prettier-plugin-tailwindcss: ^0.8.1
  prettier-plugin-toml: ^3.0.2
  oxlint: ^1.81.0
  oxlint-tsgolint: ^7.0.2001
  vitest: ^5.0.3
  '@types/node': ^24.13.3
  # backend
  '@nestjs/common': ^12.1.2
  '@nestjs/core': ^12.1.2
  '@nestjs/platform-express': ^12.1.2
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  drizzle-orm: ^0.45.3
  drizzle-kit: ^0.31.11
  mysql2: ^3.24.5
  ioredis: ^6.0.0
  zod: ^4.6.5
  uuid: ^14.0.2
  # frontend
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7
  vite: ^8.3.2
  '@vitejs/plugin-react': ^6.1.1
  '@tanstack/react-query': ^5.104.1
  '@tanstack/react-router': ^1.170.41
  '@tanstack/router-plugin': ^1.168.42
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - turbo@2.11.7
  - '@tanstack/query-core@5.104.1'
  - '@tanstack/react-query@5.104.1'

# 설치 스크립트 실행을 허용한 패키지(기본은 전부 차단).
allowBuilds:
  esbuild: true
