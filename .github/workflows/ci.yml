name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 머지 큐가 최신 main 과 합친 임시 브랜치에서 필수 검사를 다시 돌린다. 이 트리거가 없으면 큐가 결과를 기다리다 실패한다.
  merge_group:

jobs:
  # 이 job 이름(check)과 git-policy / merge-commits 가 main 병합의 필수 조건이다. 이름을 바꾸면 GitHub 의 main 규칙(필수 검사)도 같이 바꿔야 한다.
  check:
    runs-on: ubuntu-latest
    services:
      # compose.yaml 과 같은 버전. TEST_DATABASE_URL 이 있을 때만 도는 DB 통합 테스트(db-kit)를 CI 에서도 실제로 돌리기 위한 것이다.
      # e2e 나 데모는 CI 에서 돌리지 않는다 (docs/testing.md).
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 커밋 메시지 형식
        if: github.event_name == 'pull_request'
        run: scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          # 테스트가 이 이름의 DB 를 만들고 지운다. 이름은 _test 로 끝나야 한다.
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/lh_messaging_test
  # autelon 조직 공통 규칙: PR 에 merge 커밋이 있으면 실패한다 (작업 브랜치는 rebase 로만 최신화).
  git-policy:
    uses: autelon/.github/.github/workflows/git-policy.yml@main
